<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Układacz dyżurów</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body data-tab="calendar">
  <header>
    <h1>Układacz dyżurów</h1>
    <nav class="month">
      <button id="prev" class="ghost" aria-label="Poprzedni miesiąc">‹</button>
      <h2 id="month-label"></h2>
      <button id="next" class="ghost" aria-label="Następny miesiąc">›</button>
    </nav>
    <span id="status" role="status"></span>
    <div class="actions">
      <button id="bad-mode" class="ghost" aria-pressed="false" title="Oceń, jak gówniany jest każdy dzień (0-3)">Gównianość</button>
      <button id="import-open" class="ghost" title="Wczytaj grafik z tabeli (Word .docx albo wklejona)">Importuj</button>
      <button id="clear" class="ghost">Wyczyść</button>
      <button id="generate">Ułóż miesiąc</button>
      <button id="logout" class="ghost" hidden>Wyloguj</button>
    </div>
  </header>

  <main>
    <section id="calendar" class="calendar" aria-label="Grafik miesiąca"></section>

    <aside>
      <div class="panel" id="panel-people">
        <h3>Osoby <small>klik = dostępność i limity · liczba dyżurów</small></h3>
        <ul id="people" class="list"></ul>
        <form id="add-person" class="add">
          <input name="name" placeholder="Imię i nazwisko" aria-label="Nowa osoba" autocomplete="off">
          <button aria-label="Dodaj osobę">+</button>
        </form>
      </div>
      <div class="panel" id="panel-rules">
        <h3>Warunki <small>gdy dyżurują razem</small></h3>
        <ul id="rules" class="list"></ul>
        <form id="add-rule" class="rule-form"></form>
      </div>
    </aside>
  </main>

  <nav class="tabs" aria-label="Widok">
    <button class="ghost" data-tab="calendar" aria-pressed="true">Grafik</button>
    <button class="ghost" data-tab="people" aria-pressed="false">Osoby</button>
    <button class="ghost" data-tab="rules" aria-pressed="false">Warunki</button>
  </nav>

  <dialog id="import" aria-labelledby="import-title">
    <form method="dialog">
      <h3 id="import-title"></h3>
      <p class="hint">Tabela jak w Wordzie: nagłówek z nazwami miejsc, w pierwszej kolumnie numer dnia. Dyżury trafią do grafiku jako ręczne.</p>
      <label class="file">Plik Word (.docx) <input type="file" name="file" accept=".docx"></label>
      <textarea name="paste" rows="3" placeholder="…albo zaznacz tabelę w Wordzie/Excelu, skopiuj i wklej tutaj"></textarea>
      <div id="import-preview"></div>
      <menu>
        <button value="cancel" class="ghost" formnovalidate>Anuluj</button>
        <button value="ok" id="import-ok" disabled>Importuj</button>
      </menu>
    </form>
  </dialog>
</body>
</html>
