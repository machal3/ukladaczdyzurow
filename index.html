<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Układacz dyżurów</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header>
    <h1>Układacz dyżurów</h1>
    <nav class="month">
      <button id="prev" class="ghost" aria-label="Poprzedni miesiąc">‹</button>
      <h2 id="month-label"></h2>
      <button id="next" class="ghost" aria-label="Następny miesiąc">›</button>
    </nav>
    <div class="actions">
      <span id="status" role="status"></span>
      <button id="clear" class="ghost">Wyczyść</button>
      <button id="generate">Ułóż miesiąc</button>
    </div>
  </header>

  <main>
    <section id="calendar" class="calendar" aria-label="Grafik miesiąca"></section>

    <aside>
      <div class="panel">
        <h3>Osoby <small>klik = dostępność i limity · liczba dyżurów</small></h3>
        <ul id="people" class="list"></ul>
        <form id="add-person" class="add">
          <input name="name" placeholder="Imię i nazwisko" aria-label="Nowa osoba" autocomplete="off">
          <button aria-label="Dodaj osobę">+</button>
        </form>
      </div>
      <div class="panel">
        <h3>Dyżury <small>dni tygodnia</small></h3>
        <ul id="shifts" class="list"></ul>
        <form id="add-shift" class="add">
          <input name="name" placeholder="Nazwa dyżuru" aria-label="Nowy dyżur" autocomplete="off">
          <button aria-label="Dodaj dyżur">+</button>
        </form>
      </div>
      <div class="panel">
        <h3>Warunki <small>gdy dyżurują razem</small></h3>
        <ul id="rules" class="list"></ul>
        <form id="add-rule" class="rule-form"></form>
      </div>
    </aside>
  </main>
</body>
</html>
